<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedBot - Follow-Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/followup.css') }}">
</head>
<body>
<div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo"><h1>MediBot</h1></div>
        <nav class="sidebar-nav">
            <a href="/" class="nav-item"><span class="icon">⊞</span> Dashboard</a>
            <a href="/chat" class="nav-item"><span class="icon">💬</span> Patient Chat</a>
            <a href="/doctor" class="nav-item"><span class="icon">🩺</span> Doctor Console</a>
            <a href="/followup" class="nav-item active"><span class="icon">📋</span> Follow-Up</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="top-bar">
            <div>
                <h2>Patient Follow-Up</h2>
                <p class="subtitle">Track all patients' reminders, scans, and lab results.</p>
            </div>
        </header>

        <!-- All patients list -->
        <div id="patients-list" class="fu-patients-grid">
            <!-- Populated by JS -->
        </div>
    </main>
</div>

<!-- ===== Reminders Modal ===== -->
<div class="modal-overlay" id="reminders-modal">
    <div class="modal">
        <div class="modal-header">
            <h2>📋 Follow-Up Reminders</h2>
            <div style="display:flex;align-items:center;gap:0.5rem">
                <span class="fu-patient-id-badge" id="modal-pid"></span>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
        </div>
        <div class="modal-body" id="modal-reminders-list">
            <!-- Populated by JS -->
        </div>
    </div>
</div>

<script>
    let currentPid = null;

    // ============================================================
    //  ALL PATIENTS VIEW
    // ============================================================
    async function loadAllPatients() {
        const res  = await fetch('/api/followup/all_patients');
        const data = await res.json();
        const grid = document.getElementById('patients-list');

        if (!data.patients.length) {
            grid.innerHTML = '<div class="fu-empty">No patient follow-ups recorded yet.</div>';
            return;
        }

        grid.innerHTML = data.patients.map(p => {
            const date = new Date(p.last_activity * 1000).toLocaleDateString();
            const hasPending  = p.pending_count  > 0;
            const hasOverdue  = p.overdue_count  > 0;
            const statusClass = hasOverdue ? 'status-overdue' : hasPending ? 'status-pending' : 'status-done';
            const statusLabel = hasOverdue ? 'OVERDUE' : hasPending ? 'PENDING' : 'ALL DONE';

            return `
            <div class="fu-patient-card" onclick="openPatient('${p.patient_id}')">
                <div class="fu-pc-top">
                    <div class="fu-pc-icon">👤</div>
                    <div class="fu-pc-info">
                        <div class="fu-pc-id">ID: ${p.patient_id.substring(0,8)}</div>
                        <div class="fu-pc-date">Last activity: ${date}</div>
                    </div>
                    <span class="fu-badge ${statusClass}">${statusLabel}</span>
                </div>
                <div class="fu-pc-stats">
                    <div class="fu-stat"><span class="fu-stat-num">${p.total}</span><span class="fu-stat-label">Total</span></div>
                    <div class="fu-stat overdue"><span class="fu-stat-num">${p.overdue_count}</span><span class="fu-stat-label">Overdue</span></div>
                    <div class="fu-stat pending"><span class="fu-stat-num">${p.pending_count}</span><span class="fu-stat-label">Pending</span></div>
                    <div class="fu-stat done"><span class="fu-stat-num">${p.done_count}</span><span class="fu-stat-label">Done</span></div>
                </div>
                <div class="fu-pc-action">View Reminders →</div>
            </div>`;
        }).join('');
    }

    // ============================================================
    //  MODAL — one patient's reminders
    // ============================================================
    async function openPatient(pid) {
        currentPid = pid;
        document.getElementById('modal-pid').textContent = '🪪 ' + pid.substring(0,8);
        document.getElementById('modal-reminders-list').innerHTML = '<div class="fu-loading">Loading…</div>';
        document.getElementById('reminders-modal').classList.add('active');

        const res  = await fetch('/api/followup/patient/' + pid + '/reminders');
        const data = await res.json();
        renderReminders(data.reminders);
    }

    function closeModal() {
        document.getElementById('reminders-modal').classList.remove('active');
        currentPid = null;
        loadAllPatients();  // refresh counts after changes
    }

    function renderReminders(reminders) {
        const container = document.getElementById('modal-reminders-list');
        if (!reminders.length) {
            container.innerHTML = '<div class="fu-empty">No reminders for this patient.</div>';
            return;
        }

        container.innerHTML = reminders.map(r => {
            const icon = r.type === 'medication' ? '💊' : r.type === 'scan' ? '🩻' : '🧪';
            const isFollowupScan = r.type === 'scan' && r.title === 'Follow-up Scan';
            const isLab = r.type === 'lab';

            let scanAction = '';
            if (isFollowupScan) {
                scanAction = r.attached_upload
                    ? `<span class="fu-badge done">Scan Uploaded ✓</span>`
                    : `<label class="fu-btn-sm upload-label">
                            📤 Upload Scan
                            <input type="file" accept="image/*,.pdf,.dcm" style="display:none"
                                   onchange="uploadScanForReminder('${r.id}', this)">
                       </label>`;
            }

            let linkRow = '';
            if (isLab) {
                linkRow = r.link
                    ? `<div class="fu-card-link">🔗 <a href="${r.link}" target="_blank" rel="noopener">${r.link}</a></div>`
                    : `<div class="fu-card-link-form">
                            <input type="text" placeholder="Paste link to lab results..." id="link-${r.id}">
                            <button class="fu-btn-sm" onclick="saveReminderLink('${r.id}')">Save Link</button>
                       </div>`;
            }

            return `
            <div class="fu-card ${r.status === 'done' ? 'fu-done' : ''}" id="card-${r.id}">
                <div class="fu-card-icon">${icon}</div>
                <div class="fu-card-body">
                    <div class="fu-card-title">${r.title}</div>
                    <div class="fu-card-meta">${r.date_time}${r.notes ? ' — ' + r.notes : ''}</div>
                    ${linkRow}
                </div>
                <div class="fu-card-actions">
                    <span class="fu-badge ${r.status}">${r.status}</span>
                    ${scanAction}
                    ${r.status !== 'done'
                        ? `<button class="fu-btn-sm" onclick="markDone('${r.id}')">✓ Done</button>`
                        : ''}
                </div>
            </div>`;
        }).join('');
    }

    async function markDone(rid) {
        // Visual flash — turn card green instantly
        const card = document.getElementById('card-' + rid);
        if (card) {
            card.style.transition = 'background 0.3s ease, border-color 0.3s ease';
            card.style.background = '#E8F5E9';
            card.style.borderColor = '#4CAF50';
        }

        await fetch(`/api/followup/reminders/${rid}/done`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({patient_id: currentPid})
        });

        const res  = await fetch('/api/followup/patient/' + currentPid + '/reminders');
        const data = await res.json();
        const allDone = data.reminders.length > 0 && data.reminders.every(r => r.status === 'done');

        if (allDone) {
            document.getElementById('modal-reminders-list').innerHTML = `
                <div class="fu-all-done">
                    <div class="fu-all-done-icon">✅</div>
                    <h3>All Follow-Ups Completed!</h3>
                    <p>Great job! All your reminders are done.<br>Your doctor will review your progress.</p>
                    <button class="fu-back-btn" onclick="window.location.href='/doctor'">
                        🩺 Back to Doctor
                    </button>
                </div>`;
        } else {
            renderReminders(data.reminders);
        }
    }

    async function saveReminderLink(rid) {
        const input = document.getElementById('link-' + rid);
        const link  = (input && input.value.trim()) || '';
        if (!link) { alert('Please paste a link first.'); return; }
        await fetch(`/api/followup/reminders/${rid}/link`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({link, patient_id: currentPid})
        });
        openPatient(currentPid);
    }

    async function uploadScanForReminder(rid, input) {
        if (!input.files.length) return;
        const formData = new FormData();
        formData.append('file', input.files[0]);
        formData.append('patient_id', currentPid);   // pass patient_id explicitly
        await fetch(`/api/followup/reminders/${rid}/scan`, {method: 'POST', body: formData});
        openPatient(currentPid);   // refresh — scan auto-marks done
    }

    // Close modal on overlay click
    document.getElementById('reminders-modal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    // ---- INIT ----
    loadAllPatients();
</script>
</body>
</html>
